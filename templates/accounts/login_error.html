{% extends "base.html" %}

{% block title %}Login mislykkedes — {{ brand }}{% endblock %}

{% block content %}
<div class="card mx-auto text-center" style="max-width: 26rem;">
    <div class="card-body py-5">
        <div class="fs-1 mb-2">🔒</div>
        <h1 class="h5">Login mislykkedes</h1>
        <p class="text-body-secondary">Noget gik galt, da vi forsøgte at logge dig ind med Microsoft.</p>
        {% if error %}<p class="small text-body-secondary">{{ error }}</p>{% endif %}
        <a class="btn btn-primary" href="{% url 'accounts:login' %}">Prøv igen</a>
    </div>
</div>
{% endblock %}
