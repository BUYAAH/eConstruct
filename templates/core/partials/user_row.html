<li class="list-group-item d-flex align-items-center gap-2 flex-wrap" id="user-{{ u.pk }}">
    <div class="flex-grow-1">
        {{ u.get_full_name|default:u.email }}
        {% if u.is_org_admin %}<span class="badge text-bg-primary">Admin</span>{% endif %}
        {% if not u.is_active %}<span class="badge text-bg-secondary">Inaktiv</span>{% endif %}
        <div class="small text-body-secondary">{{ u.email }}</div>
        {% if error %}<div class="small text-danger">{{ error }}</div>{% endif %}
    </div>
    {% if u != request.user %}
    <button class="btn btn-sm btn-outline-secondary"
            hx-post="{% url 'core:user_toggle' u.pk 'is_org_admin' %}"
            hx-target="#user-{{ u.pk }}" hx-swap="outerHTML">
        {% if u.is_org_admin %}Fjern admin{% else %}Gør til admin{% endif %}
    </button>
    <button class="btn btn-sm {% if u.is_active %}btn-outline-danger{% else %}btn-outline-success{% endif %}"
            hx-post="{% url 'core:user_toggle' u.pk 'is_active' %}"
            hx-target="#user-{{ u.pk }}" hx-swap="outerHTML">
        {% if u.is_active %}Deaktivér{% else %}Aktivér{% endif %}
    </button>
    {% endif %}
</li>
