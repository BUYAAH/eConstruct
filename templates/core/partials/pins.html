{% comment %}
The pins for one page. data-discipline drives the chip filter in viewer.js;
pin-resolved dims what's already been dealt with so open items stand out.
The pin shows its number, which is what people call it on site.
{% endcomment %}
{% for r in registrations %}
<button class="pin {% if r.status != 'open' %}pin-resolved{% endif %}"
        style="left: {{ r.x_pct }}%; top: {{ r.y_pct }}%; --pin-color: {{ r.discipline.color }};"
        data-discipline="{{ r.discipline_id }}"
        hx-get="{% url 'core:registration_detail' r.pk %}"
        hx-target="#note-sheet-body" hx-swap="innerHTML"
        aria-label="{{ r.label }} {{ r.subject|truncatechars:60 }}">{{ r.number }}</button>
{% endfor %}
