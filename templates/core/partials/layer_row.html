<li class="list-group-item d-flex align-items-center gap-2" id="layer-{{ layer.pk }}">
    <span class="rounded-circle d-inline-block flex-shrink-0"
          style="width: 1rem; height: 1rem; background-color: {{ layer.color }};"></span>
    <span class="flex-grow-1">{{ layer.name }}</span>
    {% if error %}<span class="small text-danger">{{ error }}</span>{% endif %}
    <button class="btn btn-sm btn-outline-secondary"
            hx-get="{% url 'core:layer_edit' layer.pk %}"
            hx-target="#layer-{{ layer.pk }}" hx-swap="outerHTML">Edit</button>
    <button class="btn btn-sm btn-outline-danger"
            hx-post="{% url 'core:layer_delete' layer.pk %}"
            hx-target="#layers-section" hx-swap="innerHTML"
            hx-confirm="Delete layer '{{ layer.name }}'?">Delete</button>
</li>
