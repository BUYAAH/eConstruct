<div class="mb-2">
    <span class="badge" style="background-color: {{ note.layer.color }};">{{ note.layer.name }}</span>
    <div class="small text-body-secondary mt-1">
        {{ note.author|default:"(slettet bruger)" }} · {{ note.created_at|date:"j. F Y, H:i" }}
    </div>
</div>

<p class="mb-3" style="white-space: pre-wrap;">{{ note.text }}</p>

{% if note.photo %}
<a href="{% url 'core:note_photo' note.pk %}" target="_blank" rel="noopener">
    <img src="{% url 'core:note_photo' note.pk %}" alt="Notefoto"
         class="img-fluid rounded mb-3 d-block" style="max-height: 40vh;">
</a>
{% endif %}

{% if can_edit %}
<div class="d-flex gap-2">
    <button class="btn btn-sm btn-outline-secondary flex-fill"
            hx-get="{% url 'core:note_edit' note.pk %}"
            hx-target="#note-sheet-body" hx-swap="innerHTML">Redigér</button>
    <button class="btn btn-sm btn-outline-danger flex-fill"
            hx-post="{% url 'core:note_delete' note.pk %}"
            hx-target="#note-sheet-body" hx-swap="innerHTML"
            hx-confirm="Slet denne note?">Slet</button>
</div>
{% endif %}
