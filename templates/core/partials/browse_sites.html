<p class="text-body-secondary small mb-2">Choose a site:</p>
<div class="list-group">
    {% for site in sites %}
    <button class="list-group-item list-group-item-action py-3"
            hx-get="{% url 'core:browse' %}?site_id={{ site.id|urlencode }}&path={{ site.displayName|urlencode }}"
            hx-target="#browser" hx-swap="innerHTML">
        🌐 {{ site.displayName }}
    </button>
    {% empty %}
    <p class="text-body-secondary">No SharePoint sites found for your account.</p>
    {% endfor %}
</div>
