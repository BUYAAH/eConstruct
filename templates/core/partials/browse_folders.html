<div class="mb-2">
    <p class="text-body-secondary small mb-2">{{ path }}</p>
    <form method="post" action="{% url 'core:link_folder' %}">
        {% csrf_token %}
        <input type="hidden" name="drive_id" value="{{ drive_id }}">
        <input type="hidden" name="item_id" value="{{ item_id }}">
        <input type="hidden" name="display_path" value="{{ path }}">
        <button class="btn btn-success w-100 py-2">
            Tilknyt denne mappe{% if pdf_count %} ({{ pdf_count }} PDF{{ pdf_count|pluralize:"'er" }}){% endif %}
        </button>
    </form>
</div>

{% if folders %}
<p class="text-body-secondary small mb-2">…eller gå ind i en undermappe:</p>
<div class="list-group">
    {% for folder in folders %}
    <button class="list-group-item list-group-item-action py-3"
            hx-get="{% url 'core:browse' %}?drive_id={{ drive_id|urlencode }}&item_id={{ folder.id|urlencode }}&path={{ path|add:' / '|add:folder.name|urlencode }}"
            hx-target="#browser" hx-swap="innerHTML">
        📁 {{ folder.name }}
        <span class="text-body-secondary small">({{ folder.folder.childCount }})</span>
    </button>
    {% endfor %}
</div>
{% endif %}

<div class="mt-2">
    <button class="btn btn-sm btn-link" hx-get="{% url 'core:browse' %}" hx-target="#browser" hx-swap="innerHTML">
        &larr; Start forfra
    </button>
</div>
