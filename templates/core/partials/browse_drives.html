<div class="d-flex justify-content-between align-items-center mb-2">
    <p class="text-body-secondary small mb-0">{{ path }} — vælg et dokumentbibliotek:</p>
    <button class="btn btn-sm btn-link" hx-get="{% url 'core:browse' %}" hx-target="#browser" hx-swap="innerHTML">
        &larr; Websteder
    </button>
</div>
<div class="list-group">
    {% for drive in drives %}
    <button class="list-group-item list-group-item-action py-3"
            hx-get="{% url 'core:browse' %}?drive_id={{ drive.id|urlencode }}&path={{ path|add:' / '|add:drive.name|urlencode }}"
            hx-target="#browser" hx-swap="innerHTML">
        🗂️ {{ drive.name }}
    </button>
    {% empty %}
    <p class="text-body-secondary">Dette websted har ingen dokumentbiblioteker.</p>
    {% endfor %}
</div>
