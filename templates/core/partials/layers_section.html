<ul class="list-group list-group-flush mb-2">
    {% for layer in layers %}
    {% include "core/partials/layer_row.html" %}
    {% empty %}
    <li class="list-group-item text-body-secondary small">Ingen lag endnu — noter kræver mindst ét.</li>
    {% endfor %}
</ul>

<form hx-post="{% url 'core:layer_create' %}" hx-target="#layers-section" hx-swap="innerHTML"
      class="d-flex gap-2 align-items-start px-2 pb-1">
    {{ form.name }}
    {{ form.color }}
    <button class="btn btn-sm btn-primary flex-shrink-0">Tilføj</button>
</form>
{% if form.errors %}
<div class="small text-danger px-2">
    {% for field, errors in form.errors.items %}{{ errors|join:" " }} {% endfor %}
</div>
{% endif %}
