<form hx-post="{{ action }}" hx-target="#note-sheet-body" hx-swap="innerHTML"
      hx-encoding="multipart/form-data">
    {% if x %}
    <input type="hidden" name="x" value="{{ x }}">
    <input type="hidden" name="y" value="{{ y }}">
    <input type="hidden" name="page" value="{{ page }}">
    {% endif %}

    {% if form.errors %}
    <div class="alert alert-danger py-2 small">Udfyld venligst begge felter.</div>
    {% endif %}

    <div class="mb-2">
        <label class="form-label small text-body-secondary mb-1">Til</label>
        {{ form.layer }}
    </div>
    <div class="mb-2">
        <label class="form-label small text-body-secondary mb-1">Note</label>
        {{ form.text }}
    </div>
    <div class="mb-3">
        <label class="form-label small text-body-secondary mb-1">Foto (valgfrit)</label>
        {{ form.photo }}
    </div>
    <button class="btn btn-primary w-100 py-2">Gem note</button>
</form>
