{% extends "base.html" %}

{% block title %}Tilknyt mappe — {{ brand }}{% endblock %}
{% block page_title %}Tilknyt mappe{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h6 mb-0">Tilknyt en SharePoint-mappe</h1>
    <a class="btn btn-sm btn-outline-secondary" href="{% url 'core:folders' %}">Annullér</a>
</div>

<div class="card">
    <div class="card-body">
        <div id="browser"
             hx-get="{% url 'core:browse' %}"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="text-center py-5 text-body-secondary">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                Henter dine SharePoint-websteder…
            </div>
        </div>
    </div>
</div>
{% endblock %}
